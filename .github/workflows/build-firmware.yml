name: Build Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build firmware
      run: |
        platformio run

    - name: Extract firmware
      run: |
        cp .pio/build/esp32-c3-devkitm-1/firmware.bin ./firmware.bin

    # Only create release if running on main branch from the original repository (not a fork)
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    # Only upload release asset if running on main branch from the original repository (not a fork)
    - name: Upload Release Asset
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./firmware.bin
        asset_name: firmware.bin
        asset_content_type: application/octet-stream